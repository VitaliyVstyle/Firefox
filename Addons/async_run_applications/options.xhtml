<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta charset="utf8" />
  <title></title>
  <link rel="icon" href="svg/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="options.css" type="text/css" />
</head>

<body>
  <div id="header">
    <div class="addItem"><span class="topic" data-locale="addItem"></span><label><input id="iconsInMenu"
          type="checkbox" /><span data-locale="iconsInMenu"></span></label></div>
  </div>
  <div id="itemsInMenu">
    <span class="topic" data-locale="itemsInMenu"></span>
  </div>
  <div class="info">
    <span class="topic" data-locale="ownArguments"></span>
    <pre class="listitem">%OpenURL%<span class="description"> - URL</span></pre>
    <pre class="listitem">%ProfD%<span class="description" data-locale="ProfD"></span></pre>
    <pre class="listitem">%FilePicker%<span class="description" data-locale="filePicker2"></span></pre>
    <pre class="listitem">%FilePickerR%<span class="description" data-locale="filePicker3"></span></pre>
    <pre class="listitem">%Prompt(message)%<span class="description" data-locale="Prompt3"></span></pre>
    <pre class="listitem">%quot%<span class="description" data-locale="doubleQuotes"></span></pre>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
    <filter id="fill">
      <feComposite in="FillPaint" in2="SourceGraphic" operator="in" />
    </filter>
  </svg>
  <script src="options.js"></script>
</body>

</html>
